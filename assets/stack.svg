<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" fill="none">
  <defs>
    <style>
      .m { font-family:'JetBrains Mono',monospace; }
      .cat { font-size:12px; font-weight:700; fill:#000; letter-spacing:3px; }
      .sub { font-size:10px; fill:#000; opacity:.5; letter-spacing:2px; }
      .item { font-size:11px; fill:#000; opacity:.85; }
      .card { stroke:#000; stroke-width:1; opacity:.15; fill:none; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{ fill:#000; } 50%{ fill:#ff6600; } }
      .fade{opacity:0;animation:fade .8s ease forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
      .d4{animation-delay:.4s}.d5{animation-delay:.5s}.d6{animation-delay:.6s}
      .d7{animation-delay:.7s}.d8{animation-delay:.8s}.d9{animation-delay:.9s}
      @keyframes fade{to{opacity:1}}
    </style>
  </defs>

  <!-- WEB DEVELOPMENT -->
  <text class="m cat" x="40" y="40">WEB DEVELOPMENT</text>
  <line x1="40" y1="55" x2="1160" y2="55" stroke="#000" opacity=".15"/>

  <g class="fade d1">
    <rect class="card" x="40" y="80" width="360" height="200"/>
    <text class="m cat" x="70" y="115">FRONTEND</text>
    <text class="m item pulse" x="70" y="155">HTML</text>
    <text class="m item pulse" x="70" y="185">CSS</text>
    <text class="m item pulse" x="70" y="215">JavaScript</text>
    <text class="m item pulse" x="70" y="245">React · jQuery · Tailwind CSS</text>
  </g>
  <g class="fade d2">
    <rect class="card" x="420" y="80" width="360" height="200"/>
    <text class="m cat" x="450" y="115">BACKEND</text>
    <text class="m item pulse" x="450" y="155">Node.js</text>
    <text class="m item pulse" x="450" y="185">Express</text>
    <text class="m item pulse" x="450" y="215">PHP</text>
  </g>
  <g class="fade d3">
    <rect class="card" x="800" y="80" width="360" height="200"/>
    <text class="m cat" x="830" y="115">DATABASE</text>
    <text class="m item pulse" x="830" y="155">MySQL</text>
    <text class="m item pulse" x="830" y="185">MongoDB</text>
    <text class="m item pulse" x="830" y="215">PostgreSQL</text>
  </g>

  <!-- SYSTEM & ANDROID DEVELOPMENT -->
  <text class="m cat" x="40" y="320">SYSTEM &amp; ANDROID DEVELOPMENT</text>
  <line x1="40" y1="335" x2="1160" y2="335" stroke="#000" opacity=".15"/>

  <g class="fade d4">
    <rect class="card" x="40" y="360" width="300" height="200"/>
    <text class="m cat" x="70" y="395">PROGRAMMING LANGUAGES</text>
    <text class="m item pulse" x="70" y="435">C</text>
    <text class="m item pulse" x="70" y="465">C++</text>
    <text class="m item pulse" x="70" y="495">Java</text>
    <text class="m item pulse" x="70" y="525">Kotlin · Python</text>
  </g>
  <g class="fade d5">
    <rect class="card" x="420" y="360" width="360" height="200"/>
    <text class="m cat" x="450" y="395">ANDROID &amp; SYSTEM TOOLS</text>
    <text class="m item pulse" x="450" y="435">Android Studio</text>
    <text class="m item pulse" x="450" y="465">Android</text>
    <text class="m item pulse" x="450" y="495">Linux</text>
    <text class="m item pulse" x="450" y="525">Git</text>
  </g>
  <g class="fade d6">
    <rect class="card" x="800" y="360" width="360" height="200"/>
    <text class="m cat" x="830" y="395">DESKTOP DEVELOPMENT</text>
    <text class="m item pulse" x="830" y="435">Electron</text>
    <text class="m item pulse" x="830" y="465">React</text>
    <text class="m item pulse" x="830" y="495">Node.js</text>
  </g>

  <!-- CLOUD & DEVOPS -->
  <text class="m cat" x="40" y="600">CLOUD &amp; DEVOPS</text>
  <line x1="40" y1="615" x2="1160" y2="615" stroke="#000" opacity=".15"/>

  <g class="fade d7">
    <rect class="card" x="40" y="640" width="1120" height="80"/>
    <text class="m cat" x="70" y="675">CLOUD &amp; DEPLOYMENT</text>
    <text class="m item pulse" x="70" y="700">Firebase · Vercel · GitHub · Git</text>
  </g>

  <!-- AI / ML & DATA SCIENCE -->
  <text class="m cat" x="40" y="760">AI / ML &amp; DATA SCIENCE</text>
  <line x1="40" y1="775" x2="1160" y2="775" stroke="#000" opacity=".15"/>

  <g class="fade d8">
    <rect class="card" x="40" y="800" width="540" height="100"/>
    <text class="m cat" x="70" y="835">LANGUAGES &amp; LIBRARIES</text>
    <text class="m item pulse" x="70" y="865">Python · NumPy · Pandas</text>
    <text class="m item pulse" x="70" y="890">TensorFlow · PyTorch</text>
  </g>
  <g class="fade d9">
    <rect class="card" x="620" y="800" width="540" height="100"/>
    <text class="m cat" x="650" y="835">FRAMEWORKS &amp; TOOLS</text>
    <text class="m item pulse" x="650" y="865">LangChain · Ollama</text>
    <text class="m item pulse" x="650" y="890">LlamaIndex</text>
  </g>
</svg>
