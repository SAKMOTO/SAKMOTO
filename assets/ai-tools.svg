<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none">
  <defs>
    <style>
      .m { font-family:'JetBrains Mono',monospace; }
      .h { font-size:14px; font-weight:700; fill:#000; letter-spacing:3px; }
      .t { font-size:15px; font-weight:700; fill:#000; }
      .d { font-size:11px; fill:#000; opacity:.55; letter-spacing:2px; }
      .card { stroke:#000; stroke-width:1; opacity:.15; fill:none; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{ fill:#000; } 50%{ fill:#ff6600; } }
      .fade{opacity:0;animation:fade .8s ease forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
      .d4{animation-delay:.4s}.d5{animation-delay:.5s}.d6{animation-delay:.6s}
      @keyframes fade{to{opacity:1}}
    </style>
  </defs>
  <text class="m h" x="40" y="40">AI TOOLS &amp; PROMPT ENGINEERING</text>
  <line x1="40" y1="55" x2="1160" y2="55" stroke="#000" opacity=".15"/>

  <g class="fade d1">
    <rect class="card" x="40" y="80" width="360" height="120"/>
    <text class="m t" x="70" y="125">CHATGPT</text>
    <text class="m d" x="70" y="155">OPENAI · PROMPTING</text>
    <text class="m d pulse" x="70" y="180">💡</text>
  </g>
  <g class="fade d2">
    <rect class="card" x="420" y="80" width="360" height="120"/>
    <text class="m t" x="450" y="125">CLAUDE (ANTHROPIC)</text>
    <text class="m d" x="450" y="155">PROMPTING · ANALYSIS</text>
    <text class="m d pulse" x="450" y="180">🧠</text>
  </g>
  <g class="fade d3">
    <rect class="card" x="800" y="80" width="360" height="120"/>
    <text class="m t" x="830" y="125">GOOGLE GEMINI</text>
    <text class="m d" x="830" y="155">PROMPTING · MULTIMODAL</text>
    <text class="m d pulse" x="830" y="180">🤖</text>
  </g>
  <g class="fade d4">
    <rect class="card" x="40" y="220" width="360" height="120"/>
    <text class="m t" x="70" y="265">HUGGING FACE</text>
    <text class="m d" x="70" y="295">MODELS · DATASETS</text>
    <text class="m d pulse" x="70" y="320">🛰️</text>
  </g>
  <g class="fade d5">
    <rect class="card" x="420" y="220" width="360" height="120"/>
    <text class="m t" x="450" y="265">META LLAMA</text>
    <text class="m d" x="450" y="295">LOCAL · OLLAMA</text>
    <text class="m d pulse" x="450" y="320">🦙</text>
  </g>
  <g class="fade d6">
    <rect class="card" x="800" y="220" width="360" height="120"/>
    <text class="m t" x="830" y="265">COHERE</text>
    <text class="m d" x="830" y="295">LLM · SEARCH</text>
    <text class="m d pulse" x="830" y="320">🔎</text>
  </g>
</svg>
