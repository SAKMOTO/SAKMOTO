<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" fill="none">
  <defs>
    <style>
      .m { font-family:'JetBrains Mono',monospace; }
      .h { font-size:11px; fill:#fff; opacity:.55; letter-spacing:3px; }
      .big { font-size:32px; font-weight:800; fill:#fff; }
      .card { stroke:#fff; stroke-width:1; opacity:.18; fill:none; }
      .bar { fill:#fff; opacity:.12; }
      .fill { fill:#fff; }
      .fade{opacity:0;animation:fade .8s ease forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}
      @keyframes fade{to{opacity:1}}
    </style>
  </defs>
  <g class="fade d1"><rect class="card" x="40" y="20" width="260" height="100"/><text class="m h" x="60" y="48">PUBLIC REPOS</text><text class="m big" x="60" y="95">52</text></g>
  <g class="fade d2"><rect class="card" x="320" y="20" width="260" height="100"/><text class="m h" x="340" y="48">FOLLOWERS</text><text class="m big" x="340" y="95">4</text></g>
  <g class="fade d3"><rect class="card" x="600" y="20" width="260" height="100"/><text class="m h" x="620" y="48">TOTAL STARS</text><text class="m big" x="620" y="95">12</text></g>
  <g class="fade d4"><rect class="card" x="880" y="20" width="280" height="100"/><text class="m h" x="900" y="48">CONTRIBUTIONS / YEAR</text><text class="m big" x="900" y="95">1094</text></g>
  <text class="m h" x="40" y="160">TOP LANGUAGES</text>
  <rect class="bar" x="40" y="180" width="1120" height="10"/>
  <rect class="fill" x="40" y="180" width="480" height="10"/>
  <rect class="fill" x="520" y="180" width="280" height="10" opacity=".7"/>
  <rect class="fill" x="800" y="180" width="200" height="10" opacity=".5"/>
  <rect class="fill" x="1000" y="180" width="160" height="10" opacity=".3"/>
  <text class="m h" x="40" y="220">C / C++ 42%</text>
  <text class="m h" x="520" y="220">JAVA 24%</text>
  <text class="m h" x="800" y="220">PYTHON 18%</text>
  <text class="m h" x="1000" y="220">OTHER 16%</text>
</svg>
