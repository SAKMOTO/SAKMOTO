<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" fill="none">
  <defs>
    <style>
      .m { font-family:'JetBrains Mono','Fira Code',monospace; fill:#fff; }
      .name { font-size:64px; font-weight:700; letter-spacing:-2px; }
      .sub { font-size:14px; letter-spacing:5px; opacity:.55; }
      .tag { font-size:13px; letter-spacing:2px; opacity:.75; }
      .line { stroke:#fff; stroke-width:1; opacity:.25; }
      .cursor { animation: blink 1.1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <line class="line" x1="0" y1="40" x2="1200" y2="40"/>
  <line class="line" x1="0" y1="200" x2="1200" y2="200"/>
  <text class="m sub" x="40" y="72">SYSTEM ENGINEER · ANDROID / KERNEL / ROM</text>
  <text class="m name" x="40" y="150">MOHAMMED HARUN<tspan class="cursor">_</tspan></text>
  <text class="m tag" x="40" y="186">C · C++ · JAVA · KOTLIN · PYTHON · ELECTRON · AI/ML</text>
  <text class="m sub" x="40" y="226">EST. 2023 · INDIA · @SAKMOTO</text>
</svg>
